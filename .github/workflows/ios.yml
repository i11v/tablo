name: iOS

# Builds the native app (apps/ios/) and runs TabloTests on a simulator. The app
# builds from apps/ios/ alone (XcodeGen project.yml + Swift sources), so web- and
# worker-only changes skip the macOS runner.
#
# Deliberately NOT filtered on packages/contract/**: what TabloTests read of
# the contract is apps/ios/TabloTests/ContractFixtures/, JSON generated from the
# schemas (`bun run contract:write`, kept current by `bun run test`). A
# contract change that alters the wire alters those files, which are under
# apps/ios/ and trigger this; one that doesn't can't change this workflow's result.
# Breaks for builds already installed are caught by contract.yml instead.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# One run per ref: a new push to a PR cancels its superseded run. On main a
# started run always finishes (GitHub may still drop a queued one in favour of
# a newer push).
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build & test (simulator)
    # Xcode 27 — what the app is developed with — is only on the `xcode-27`
    # image (macOS 27, public preview: no SLA, possible queueing) as of
    # 2026-10; the GA `macos-26`/`macos-latest` image tops out at Xcode 26.6
    # (iOS 26.5 SDK). Once Xcode 27 lands on a GA image, switch to that label.
    # GA fallback: `runs-on: macos-26` + XCODE_VERSION "26.6".
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      XCODE_VERSION: "27.0" # selects /Applications/Xcode_<version>.app
    defaults:
      run:
        shell: bash # = bash -eo pipefail, so `xcodebuild | xcbeautify` fails when xcodebuild does
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            installed=(/Applications/Xcode*.app)
            echo "::error::Xcode $XCODE_VERSION is not on this runner image ($app missing). Installed: ${installed[*]}"
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Install XcodeGen (+ xcbeautify if the image lacks it)
        run: |
          brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify   # preinstalled on GitHub's macOS images
          echo "XcodeGen $(xcodegen --version | sed 's/^Version: //'), xcbeautify $(xcbeautify --version)"

      - name: Generate Xcode project # Tablo.xcodeproj + Tablo/Info.plist are generated, not committed
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Device sets differ per image (and change as images update), so
          # never hardcode a name: take the first available iPhone on the
          # newest iOS runtime the selected Xcode's SDK can run.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          pick=$(xcrun simctl list devices available -j | jq -r --arg sdk "$sdk" '
            def ver: gsub("-"; ".") | split(".") | map(tonumber);
            ($sdk | ver) as $max
            | [ .devices | to_entries[]
                | select(.key | test("\\.SimRuntime\\.iOS-[0-9]"))
                | (.key | sub(".*\\.SimRuntime\\.iOS-"; "") | ver) as $v
                | select($v <= $max)
                | .value[] | select(.isAvailable and (.name | startswith("iPhone")))
                | {v: $v, udid, name} ]
            | group_by(.v) | last // [] | first // empty
            | "\(.udid)\t\(.name) (iOS \(.v | map(tostring) | join(".")))"')
          if [ -z "$pick" ]; then
            echo "::error::No available iPhone simulator with an iOS runtime <= the iOS $sdk SDK (Xcode $XCODE_VERSION). Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          udid=${pick%%$'\t'*}
          echo "Using ${pick#*$'\t'} — $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Computed in the shell rather than with hashFiles(): on the macOS
      # runner hashFiles() has timed out (120 s) while the simulator boots.
      - name: Cache keys
        id: keys
        run: echo "deps=xcode${XCODE_VERSION}-$(shasum -a 256 project.yml | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Swift packages (Honeycomb pulls in ~28: NIO, gRPC, BoringSSL…) are
      # pinned by exactVersion in project.yml, so its hash keys the checkouts.
      # A hit skips the network fetch entirely (-skipPackageUpdates below).
      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache@v5
        with:
          path: apps/ios/build/SourcePackages
          key: spm-${{ steps.keys.outputs.deps }}

      # Compiled package modules. Restored on every run; saved on main (PRs can
      # read main's caches) and on a run that found nothing, so a PR's re-runs
      # benefit too. The app's own sources are checked out fresh (new mtimes)
      # and always recompile; only unchanged package objects are reused.
      - name: Restore DerivedData
        id: dd-cache
        uses: actions/cache/restore@v5
        with:
          path: | # must match the save step's paths exactly, or the restore misses
            apps/ios/build/DerivedData
            !apps/ios/build/DerivedData/Logs
            !apps/ios/build/DerivedData/Index.noindex
          key: dd-${{ steps.keys.outputs.deps }}-${{ github.sha }}
          restore-keys: dd-${{ steps.keys.outputs.deps }}-

      - name: Start booting the simulator # in the background: it boots while the build below runs
        run: |
          # simctl boot can block until the device is up; detach it so the
          # build starts right away. "Wait for the simulator" joins it later.
          nohup xcrun simctl boot "$SIM_UDID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}

      - name: Build for testing
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          SPM_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          NSUnbufferedIO: "YES" # stream xcodebuild output through the pipe as it happens
        run: |
          mkdir -p build   # gitignored (apps/ios/.gitignore); holds DerivedData, packages, the result bundle and raw logs
          # xcodegen regenerates the project without its Package.resolved; put
          # back the one saved alongside the package cache so no resolution
          # against the remotes is needed.
          resolved=Tablo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f build/SourcePackages/Package.resolved ]; then
            mkdir -p "$(dirname "$resolved")"
            cp build/SourcePackages/Package.resolved "$resolved"
          fi
          args=(
            build-for-testing
            -project Tablo.xcodeproj
            -scheme Tablo
            -destination "platform=iOS Simulator,id=$SIM_UDID"
            -derivedDataPath build/DerivedData
            -clonedSourcePackagesDirPath build/SourcePackages
            -skipPackagePluginValidation
            -skipMacroValidation
            CODE_SIGNING_ALLOWED=NO          # simulator build: nothing to sign, no team needed
            COMPILER_INDEX_STORE_ENABLE=NO   # no IDE on CI — skip indexing
          )
          if [ "$SPM_HIT" = "true" ]; then args+=(-skipPackageUpdates); fi
          xcodebuild "${args[@]}" 2>&1 | tee build/xcodebuild-build.log | xcbeautify --renderer github-actions
          if [ -f "$resolved" ]; then cp "$resolved" build/SourcePackages/Package.resolved; fi

      - name: Save DerivedData
        if: success() && (github.ref == 'refs/heads/main' || steps.dd-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v5
        with:
          path: |
            apps/ios/build/DerivedData
            !apps/ios/build/DerivedData/Logs
            !apps/ios/build/DerivedData/Index.noindex
          key: ${{ steps.dd-cache.outputs.cache-primary-key }}

      - name: Wait for the simulator # usually booted by now; a slow first boot can't time out the test runner
        run: xcrun simctl bootstatus "$SIM_UDID" -b
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}

      - name: Test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          NSUnbufferedIO: "YES"
        run: |
          # Run from the .xctestrun that build-for-testing wrote: no project
          # load or package resolution, which cost minutes on this runner.
          xctestrun=$(ls build/DerivedData/Build/Products/*.xctestrun | head -n1)
          args=(
            test-without-building
            -xctestrun "$xctestrun"
            -destination "platform=iOS Simulator,id=$SIM_UDID"
            -resultBundlePath build/Tablo.xcresult
          )
          xcodebuild "${args[@]}" 2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7 # v6+ runs on Node 24 (v5 still defaults to Node 20)
        with:
          name: ios-test-results
          path: |
            apps/ios/build/Tablo.xcresult
            apps/ios/build/xcodebuild-build.log
            apps/ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
