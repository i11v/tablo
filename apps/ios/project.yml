name: Tablo
options:
  bundleIdPrefix: run.tablo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  Honeycomb:
    url: https://github.com/honeycombio/honeycomb-opentelemetry-swift
    exactVersion: 2.6.0
  # the OTel API/SDK Honeycomb is built on (its Package.swift pins it exactly)
  OpenTelemetryCore:
    url: https://github.com/open-telemetry/opentelemetry-swift-core
    exactVersion: 2.5.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Tablo:
    type: application
    platform: iOS
    sources:
      - path: Tablo
        excludes:
          - "**/*.txt"
    dependencies:
      - package: Honeycomb
      - package: OpenTelemetryCore
        product: OpenTelemetryApi
      - package: OpenTelemetryCore
        product: OpenTelemetrySdk
    configFiles:
      Debug: Tablo.xcconfig
      Release: Tablo.xcconfig
    preBuildScripts:
      # A key-less build sends no telemetry; say so rather than stay silent.
      - name: Check Honeycomb key
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$HONEYCOMB_API_KEY" ]; then
            echo "warning: HONEYCOMB_API_KEY is empty, so this build sends no telemetry. Set it in apps/ios/Local.xcconfig; in a git worktree, run scripts/link-local-config.sh."
          fi
    info:
      path: Tablo/Info.plist
      properties:
        CFBundleDisplayName: tablo
        UIAppFonts:
          - HankenGrotesk-Variable.ttf
          - Doto-Variable.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: tablo uses your location to show where you are and how long it takes you to walk to each stop.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TabloAPIBase: $(TABLO_API_BASE)
        HoneycombAPIKey: $(HONEYCOMB_API_KEY)
        HoneycombAPIHost: $(HONEYCOMB_API_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.tablo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Backend baked into the build; override per build, e.g.
        # `xcodebuild … TABLO_API_BASE=https://preview-32.tablo.run`.
        TABLO_API_BASE: https://tablo.run
  TabloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # includes ContractFixtures/*.json, copied into the test bundle as resources
      - path: TabloTests
    dependencies:
      - target: Tablo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.tablo.app.tests
schemes:
  Tablo:
    build:
      targets:
        Tablo: all
        TabloTests: [test]
    test:
      targets:
        - TabloTests
    run:
      config: Debug
