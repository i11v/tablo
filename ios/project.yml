name: Tablo
options:
  bundleIdPrefix: run.tablo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Tablo:
    type: application
    platform: iOS
    sources:
      - path: Tablo
        excludes:
          - "**/*.txt"
    info:
      path: Tablo/Info.plist
      properties:
        CFBundleDisplayName: tablo
        UIAppFonts:
          - HankenGrotesk-Variable.ttf
          - Doto-Variable.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: tablo uses your location to show where you are and how long it takes you to walk to each stop.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TabloAPIBase: $(TABLO_API_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.tablo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Backend baked into the build; override per build, e.g.
        # `xcodebuild … TABLO_API_BASE=https://preview-32.tablo.run`.
        TABLO_API_BASE: https://tablo.run
  TabloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TabloTests
    dependencies:
      - target: Tablo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.tablo.app.tests
schemes:
  Tablo:
    build:
      targets:
        Tablo: all
        TabloTests: [test]
    test:
      targets:
        - TabloTests
    run:
      config: Debug
